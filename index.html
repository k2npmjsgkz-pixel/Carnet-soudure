<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet Soudeur">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Carnet Soudeur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Atelier : acier bleuté + orange de chauffe. Accueil = grille d'outils ; outil = dessin → saisie → résultats → enregistrer */
  --bg:#edf0f2; --surface:#ffffff; --ink:#1a2026; --muted:#5b6670; --line:#d2d8dd; --fill:#dfe5ea;
  --accent:#b9500c; --accent-soft:#f7e6d9; --on-accent:#ffffff;
  --ok:#2f7d4f; --warn:#8a5f00; --warn-soft:#fbf0d2; --bad:#b3261e;
  --c-chaud:#2f6fa8; --c-tuy:#2b8460; --c-ref:#9a7420; --c-meca:#0e7c86; --c-fer:#a3472c;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0e11; --surface:#151a1f; --ink:#eef1f3; --muted:#98a3ac; --line:#252d34; --fill:#242c33;
    --accent:#ff8a3d; --accent-soft:#3a2617; --on-accent:#1a0f06;
    --ok:#5cc58a; --warn:#e6bd4a; --warn-soft:#33290f; --bad:#ff6b5e; color-scheme:dark;
    --c-chaud:#6aa6dc; --c-tuy:#5cc38f; --c-ref:#d4a94a; --c-meca:#4cc6d1; --c-fer:#e8805f;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e11; --surface:#151a1f; --ink:#eef1f3; --muted:#98a3ac; --line:#252d34; --fill:#242c33;
  --accent:#ff8a3d; --accent-soft:#3a2617; --on-accent:#1a0f06;
  --ok:#5cc58a; --warn:#e6bd4a; --warn-soft:#33290f; --bad:#ff6b5e; color-scheme:dark;
  --c-chaud:#6aa6dc; --c-tuy:#5cc38f; --c-ref:#d4a94a; --c-meca:#4cc6d1; --c-fer:#e8805f;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{color:var(--accent)}
.top-in .sp{flex:1}
.iconbtn{min-width:48px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
#favBtn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-weight:600;height:44px;padding:0 12px 0 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.back svg{width:18px;height:18px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:30px;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:22px;text-transform:uppercase;letter-spacing:.02em}
h3{font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.lede{color:var(--muted);margin:4px 0 0}
.search{margin:16px 0 10px;position:relative}
.search input{width:100%;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 44px;font-size:17px}
.search svg{position:absolute;left:14px;top:15px;width:22px;height:22px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chip{flex:none;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cat,var(--accent));border-radius:12px;padding:12px 12px 14px;min-height:96px}
.tcard b{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.1}
.tcard small{color:var(--muted);font-size:13.5px;line-height:1.3}
.tcard .cat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec-title{margin:22px 0 10px;display:flex;align-items:baseline;gap:8px}
.sec-title .n{color:var(--muted);font-size:14px}
.empty{color:var(--muted);padding:24px 0;text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.tool-head{padding-top:14px}
.drw{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:12px;padding:6px}
.drw svg{display:block;width:100%;height:auto}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>span{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fld>span em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500}
.fld input,.fld select,.inp{height:52px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:20px;font-variant-numeric:tabular-nums;width:100%;min-width:0}
.fld select{font-size:17px;padding-right:6px}
.fld input:focus,.fld select:focus,.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fld[hidden]{display:none}
.rows{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.rows .rh,.rows .rw{display:grid;grid-template-columns:1fr 92px 48px;gap:8px;align-items:center}
.rows .rh span{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rows .rw button{height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;cursor:pointer;color:var(--muted)}
.btn{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-weight:600;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{height:40px;font-size:14px;padding:0 12px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px}
.tile .l{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-family:var(--display);font-size:32px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .v small{font-family:var(--body);font-size:15px;font-weight:600;color:var(--muted);margin-left:3px}
.rlist{margin:0;display:flex;flex-direction:column}
.rlist div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.rlist div:last-child{border-bottom:0}
.rlist dt{color:var(--muted);font-size:15px}
.rlist dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.rlist dd small{color:var(--muted);font-weight:500}
.msg{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px}
.msg.warn{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn)}
.msg.err{background:var(--warn-soft);border-left:4px solid var(--bad)}
.notes{color:var(--muted);font-size:14px;margin:10px 2px 0;padding-left:18px}
.notes li{margin:3px 0}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
table.t th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}
details.acc{border-bottom:1px solid var(--line)}
details.acc:last-child{border-bottom:0}
details.acc summary{padding:12px 2px;font-weight:600;cursor:pointer;font-size:17px;list-style:none;display:flex;justify-content:space-between}
details.acc summary::after{content:"+";color:var(--accent);font-size:22px;line-height:1}
details.acc[open] summary::after{content:"–"}
details.acc .bd{padding:0 2px 12px;color:var(--ink)}
details.acc .bd p{margin:4px 0}
details.acc .bd b{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.sym{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sym figure{margin:0;background:var(--bg);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.sym svg{width:100%;max-width:130px;height:56px}
.sym figcaption{font-size:14px;font-weight:600}
.sym figcaption small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.save .row{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0}
.prt-h{display:flex;align-items:center;gap:8px} .prt-s{font-weight:600;margin:0 0 10px;font-size:15px} .prt-n{color:var(--muted);font-size:13px;margin:10px 0 0;line-height:1.4} #prtB svg{margin-right:8px} #prtB:disabled{opacity:.45;cursor:default} .savemsg{color:var(--ok);font-weight:600;margin:8px 0 0}
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer-v{font-family:var(--display);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;min-width:120px}
.timer-v.done{color:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.timer-v.done{animation:none}}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}
nav.bottom a{height:60px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:600;font-size:16px;border-top:3px solid transparent}
nav.bottom a[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
nav.bottom svg{width:22px;height:22px}
.job{display:flex;flex-direction:column;gap:6px}
.job-h{display:flex;align-items:center;gap:10px;justify-content:space-between}
.job-h b{font-family:var(--display);font-size:22px;font-weight:600}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.item{border-top:1px solid var(--line);padding:10px 0}
.item-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item-h b{font-size:16px}
.item-h time{color:var(--muted);font-size:13px;flex:none}
.item .kv{color:var(--muted);font-size:14.5px;margin-top:2px}
.item .kv strong{color:var(--ink);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:9;max-width:90vw;text-align:center}
.foot{color:var(--muted);font-size:13px;margin:22px 2px 0}
.ico{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ico .h{stroke:var(--cat,var(--accent))}
.ico .hf,.ico .hf circle{fill:var(--cat,var(--accent));stroke:none}
.tl{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 14px;min-height:124px;-webkit-tap-highlight-color:transparent}
.tl:active{transform:scale(.98)}
.ib{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;background:var(--bg);background:color-mix(in srgb,var(--cat) 14%,var(--surface));flex:none}
.ib svg{width:42px;height:42px}
.tl b{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.1}
.grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.recents{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.rc{flex:none;display:flex;align-items:center;gap:8px;height:52px;padding:0 14px 0 6px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
.rc .ib{width:40px;height:40px;border-radius:10px}.rc .ib svg{width:30px;height:30px}
.sec-title .dot{width:10px;height:10px;border-radius:3px;background:var(--cat);align-self:center}
.th{display:flex;align-items:center;gap:12px}
.th .ib{width:64px;height:64px;border-radius:16px}.th .ib svg{width:46px;height:46px}
.rbar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:5;pointer-events:none}
.rbar .in{max-width:760px;margin:0 auto;padding:0 12px 8px}
.rbar button{pointer-events:auto;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;padding:6px 16px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;text-align:left}
.rbar .l{font-size:13px;opacity:.75;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.rbar .v{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rbar .v small{font-family:var(--body);font-size:14px;opacity:.75;margin-left:3px}
.rbar[hidden]{display:none}
.wrap.tool{padding-bottom:150px}
details.save>summary{list-style:none;display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer}
details.save>summary::-webkit-details-marker{display:none}
details.save[open]>summary{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
nav.bottom .in{grid-template-columns:1fr 1fr 1fr}
.iso-stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden;touch-action:none;height:52vh;min-height:300px;max-height:560px;user-select:none;-webkit-user-select:none}
.iso-stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.iso-ctrl{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:2}
.iso-ctrl button,.iso-start{height:40px;min-width:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;padding:0 10px;cursor:pointer}
.iso-ctrl button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.iso-start{position:absolute;left:8px;bottom:8px;z-index:2;border-color:var(--accent);background:var(--accent-soft)}
.iso-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:40px;pointer-events:none}
.iso-empty[hidden]{display:none}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.dpad button{height:62px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.dpad button svg{width:24px;height:24px}
.dpad button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.sublbl{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 6px}
.selbar{border-left:4px solid var(--accent)}
.isocard{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center;text-decoration:none;color:var(--ink)}
.isocard .thumb{background:var(--bg);border-radius:10px;height:84px;overflow:hidden}
.isocard .thumb svg{width:100%;height:100%;display:block}
.fld.wide[hidden],.fld[hidden]{display:none}
svg .i-pipe{stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;fill:none}
svg .i-pipeSel{stroke:var(--accent);stroke-width:5;stroke-linecap:round;fill:none}
svg .i-hit{stroke:transparent;stroke-width:26;fill:none;cursor:pointer}
svg .i-dim,svg .i-ext{stroke:var(--muted);stroke-width:1;fill:none}
svg .i-sym{stroke:var(--ink);stroke-width:1.6}
svg .i-north{stroke:var(--muted);stroke-width:1.4}
svg .i-start{stroke:var(--accent);stroke-width:2.5}
svg .f-none{fill:none}svg .f-ink{fill:var(--ink)}svg .f-paper{fill:var(--surface)}svg .f-muted{fill:var(--muted)}svg .f-accent{fill:var(--accent)}
svg .i-t{font-family:var(--body);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
svg .i-t.b{font-weight:700}
svg .c-ink{fill:var(--ink)}svg .c-muted{fill:var(--muted)}svg .c-accent{fill:var(--accent)}
svg .sh{fill:var(--fill);stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
svg .wd{fill:var(--accent);fill-opacity:.85;stroke:var(--accent);stroke-width:1.2;stroke-linejoin:round}
svg .cut{fill:var(--accent);fill-opacity:.18;stroke:none}
svg .hole{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
svg .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
svg .ac{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
svg .tube{fill:none;stroke:var(--fill);stroke-width:14;stroke-linecap:butt;stroke-linejoin:round}
svg .tubeo{fill:none;stroke:var(--ink);stroke-width:16;stroke-linecap:butt;stroke-linejoin:round}
svg .cn{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:5 4}
svg .dm,svg .ext{fill:none;stroke:var(--muted);stroke-width:1}
svg .arw{fill:var(--muted)}
svg .tx,svg .td,svg .tm{font-family:var(--body);font-size:12.5px;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
svg .tx{fill:var(--ink);font-weight:600}
svg .td{fill:var(--accent);font-weight:700}
svg .tm{fill:var(--muted);font-size:11px}
svg .bar{fill:var(--fill);stroke:var(--line)}
svg .pc{fill:var(--accent);fill-opacity:.25;stroke:var(--accent);stroke-width:1}
svg .seg{fill:var(--accent)}
</style>
</head>
<body>
<header class="top"><div class="top-in" id="topbar"></div></header>

/* ---------- utilitaires ---------- */
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function fmt(x,d=1){ if(typeof x!=="number"||!isFinite(x)) return "—"; return x.toLocaleString("fr-BE",{maximumFractionDigits:d,minimumFractionDigits:0}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function parseNum(s){
  if(s==null) return NaN; s=String(s).trim().replace(/,/g,"."); if(!s) return NaN;
  let m=s.match(/^(-?\d+(?:\.\d+)?)\s+(\d+)\/(\d+)$/); if(m){const w=+m[1]; return w+(w<0?-1:1)*(+m[2])/(+m[3]);}
  m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/); if(m) return (+m[1])/(+m[2]);
  const v=Number(s); return isFinite(v)?v:NaN;
}
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

/* ---------- dessin SVG à l'échelle ---------- */
function drawing(bb,opt={}){
  const W=opt.W||360,pad=opt.pad==null?30:opt.pad;
  const [x0,y0,x1,y1]=bb, w=Math.max(x1-x0,1e-9), h=Math.max(y1-y0,1e-9);
  const H=Math.round(Math.max(opt.minH||130,Math.min(opt.H||210,(W-2*pad)*(h/w)+2*pad)));
  const s=Math.min((W-2*pad)/w,(H-2*pad)/h);
  const ox=(W-w*s)/2-x0*s, oy=(H+h*s)/2+y0*s;
  const X=x=>+(ox+x*s).toFixed(1), Y=y=>+(oy-y*s).toFixed(1);
  const o=[]; const P=pts=>pts.map(p=>X(p[0])+","+Y(p[1])).join(" ");
  const D={X,Y,s,
    poly(pts,cls="sh"){o.push(`<polygon class="${cls}" points="${P(pts)}"/>`);return D},
    pl(pts,cls="ln"){o.push(`<polyline class="${cls}" points="${P(pts)}"/>`);return D},
    line(a,b,cls="ln"){o.push(`<line class="${cls}" x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(b[0])}" y2="${Y(b[1])}"/>`);return D},
    circle(c,r,cls="sh"){o.push(`<circle class="${cls}" cx="${X(c[0])}" cy="${Y(c[1])}" r="${(r*s).toFixed(1)}"/>`);return D},
    text(p,t,cls="tx",anc="middle",dx=0,dy=0){o.push(`<text class="${cls}" x="${(X(p[0])+dx).toFixed(1)}" y="${(Y(p[1])+dy).toFixed(1)}" text-anchor="${anc}" dominant-baseline="middle">${esc(t)}</text>`);return D},
    dim(a,b,label,off=16){
      const ax=X(a[0]),ay=Y(a[1]),bx=X(b[0]),by=Y(b[1]);
      const L=Math.hypot(bx-ax,by-ay)||1,ux=(bx-ax)/L,uy=(by-ay)/L,nx=uy,ny=-ux;
      const A2=[ax+nx*off,ay+ny*off],B2=[bx+nx*off,by+ny*off],sg=off>=0?1:-1;
      o.push(`<line class="ext" x1="${(ax+nx*3*sg).toFixed(1)}" y1="${(ay+ny*3*sg).toFixed(1)}" x2="${(A2[0]+nx*4*sg).toFixed(1)}" y2="${(A2[1]+ny*4*sg).toFixed(1)}"/>`);
      o.push(`<line class="ext" x1="${(bx+nx*3*sg).toFixed(1)}" y1="${(by+ny*3*sg).toFixed(1)}" x2="${(B2[0]+nx*4*sg).toFixed(1)}" y2="${(B2[1]+ny*4*sg).toFixed(1)}"/>`);
      o.push(`<line class="dm" x1="${A2[0].toFixed(1)}" y1="${A2[1].toFixed(1)}" x2="${B2[0].toFixed(1)}" y2="${B2[1].toFixed(1)}"/>`);
      const ar=(T,dir)=>{const bxp=T[0]+ux*7*dir,byp=T[1]+uy*7*dir;o.push(`<polygon class="arw" points="${T[0].toFixed(1)},${T[1].toFixed(1)} ${(bxp+nx*2.6).toFixed(1)},${(byp+ny*2.6).toFixed(1)} ${(bxp-nx*2.6).toFixed(1)},${(byp-ny*2.6).toFixed(1)}"/>`)};
      if(L>18){ar(A2,1);ar(B2,-1);}
      const mx=(A2[0]+B2[0])/2+nx*10*sg,my=(A2[1]+B2[1])/2+ny*10*sg;
      const anc=Math.abs(nx)>0.7?(nx*sg>0?"start":"end"):"middle";
      o.push(`<text class="tx" x="${mx.toFixed(1)}" y="${my.toFixed(1)}" text-anchor="${anc}" dominant-baseline="middle">${esc(label)}</text>`);
      return D},
    raw(str){o.push(str);return D},
    svg(lbl){return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(lbl||"Schéma")}">${o.join("")}</svg>`}
  };
  return D;
}
function arcPts(c,r,a0,a1,n=40){const p=[];for(let i=0;i<=n;i++){const a=rad(a0+(a1-a0)*i/n);p.push([c[0]+r*Math.cos(a),c[1]+r*Math.sin(a)]);}return p;}
function capPts(x0,x1,y,hgt,n=10){const p=[],xm=(x0+x1)/2,hw=(x1-x0)/2;for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;p.push([x,y+hgt*(1-((x-xm)/hw)**2)]);}return p;}
function bbox(pts){let a=[Infinity,Infinity,-Infinity,-Infinity];pts.forEach(p=>{a[0]=Math.min(a[0],p[0]);a[1]=Math.min(a[1],p[1]);a[2]=Math.max(a[2],p[0]);a[3]=Math.max(a[3],p[1]);});return a;}

/* coupe de joint soudé */
function drawJoint(o){
  const t=o.t;
  if(o.type==="angle"||o.type==="t"){
    const z=o.a*Math.SQRT2, w=Math.max(3*t,2.6*z+t,24), hh=Math.max(2.4*t,2*z+10,22);
    const D=drawing([-w,-2,w,t+hh],{H:200,pad:40});
    if(o.deform){const dd=o.deform;D.pl([[-w,t+dd],[-t/2,t],[t/2,t],[w,t+dd]],"cn");}
    D.poly([[-w,0],[w,0],[w,t],[-w,t]]);
    D.poly([[-t/2,t],[t/2,t],[t/2,t+hh],[-t/2,t+hh]]);
    D.poly([[t/2,t],[t/2+z,t],[t/2,t+z]],"wd"); D.poly([[-t/2,t],[-t/2-z,t],[-t/2,t+z]],"wd");
    D.line([t/2,t],[t/2+z/2,t+z/2],"ln");
    D.text([t/2+z/2,t+z/2],"a "+fmt(o.a,1),"td","start",8,-6);
    D.dim([-w,t],[-w,0],"t "+fmt(t,1),-14);
    if(o.W) D.dim([-w,0],[w,0],"semelle "+fmt(o.W,0),-16);
    return D.svg("Coupe d'une soudure d'angle en T");
  }
  const g=o.g||0,c=o.c||0,w=Math.max(2.4*t,22),cap=Math.max(1,0.12*t),rp=Math.max(.6,.07*t);
  const pts=[[-w,-cap-2],[w,t+cap+2]];
  const D=drawing(pts[0].concat(pts[1]),{H:190,pad:40,minH:140});
  let wd;
  if(o.type==="v"){
    const b=(t-c)*Math.tan(rad(o.ang/2));
    D.poly([[-w,0],[-g/2,0],[-g/2,c],[-g/2-b,t],[-w,t]]);
    D.poly([[w,0],[g/2,0],[g/2,c],[g/2+b,t],[w,t]]);
    wd=[...capPts(-g/2-b-.8,g/2+b+.8,t,cap),[g/2+b,t],[g/2,c],[g/2,0],...capPts(g/2+.4,-g/2-.4,0,-rp),[-g/2,0],[-g/2,c],[-g/2-b,t]];
    D.poly(wd,"wd");
    D.text([0,t],fmt(o.ang,0)+"°","td","middle",0,-18);
  } else if(o.type==="x"){
    const hh=(t-c)/2,b=hh*Math.tan(rad(o.ang/2));
    D.poly([[-w,0],[-g/2-b,0],[-g/2,hh],[-g/2,hh+c],[-g/2-b,t],[-w,t]]);
    D.poly([[w,0],[g/2+b,0],[g/2,hh],[g/2,hh+c],[g/2+b,t],[w,t]]);
    wd=[...capPts(-g/2-b-.8,g/2+b+.8,t,cap),[g/2+b,t],[g/2,hh+c],[g/2,hh],[g/2+b,0],...capPts(g/2+b+.8,-g/2-b-.8,0,-cap),[-g/2-b,0],[-g/2,hh],[-g/2,hh+c],[-g/2-b,t]];
    D.poly(wd,"wd");
    D.text([0,t],fmt(o.ang,0)+"°","td","middle",0,-18);
  } else {
    D.poly([[-w,0],[-g/2,0],[-g/2,t],[-w,t]]); D.poly([[w,0],[g/2,0],[g/2,t],[w,t]]);
    wd=[...capPts(-g/2-1.5,g/2+1.5,t,cap),[g/2,t],[g/2,0],...capPts(g/2+.5,-g/2-.5,0,-rp),[-g/2,0],[-g/2,t]];
    D.poly(wd,"wd");
  }
  D.dim([-w,t],[-w,0],"t "+fmt(t,1),-14);
  if(g>0) D.text([0,0],"écart "+fmt(g,1),"tm","middle",0,20);
  if(o.shrink) {D.text([w,t/2],"← "+fmt(o.shrink,1)+" mm →","td","end",-4,0);}
  return D.svg("Coupe du joint bout à bout");
}

T.push({id:"reglages",cat:"soud",name:"Réglages du poste",desc:"Intensité, tension, fil, gaz, préparation et passes",
kw:"amperage intensite tension vitesse fil mig mag tig electrode mma baguette tungstene reglage passes chanfrein preparation",

  S("proc","Procédé",[["mag","MIG / MAG"],["tig","TIG"],["mma","Électrode (MMA)"]],"mag"),

  S("pos","Position",[["PA","PA à plat"],["PB","PB angle à plat"],["PC","PC corniche"],["PF","PF montant"],["PG","PG descendant"],["PE","PE plafond"]],"PA"),
  N("t","Épaisseur","mm",6),
  N("a","Gorge a","mm",4,{show:v=>v.joint==="angle"})
],
calc(v){
  const t=v.t; if(!(t>0)) return {err:"Indique l'épaisseur."};

  const header=(pg,sub)=>{pg.text(tp.title,m,m+4,12,{bold:true});pg.text((tp.info||[]).map(i=>i[0]+" : "+i[1]).join("   ·   "),m,m+10,7.5,{color:[90,96,102]});pg.text(sub||"Échelle 1:1 · imprime à 100 % (taille réelle), sans « ajuster à la page »",m,m+15,7.5,{color:[185,80,12]});};
  if(fmt==="plot"){const pw=Math.max(W+2*m,160),ph=H+2*m+head+foot,pg=doc.page(pw,ph);header(pg);
    const ox=(pw-W)/2-x0,top=m+head;renderPrims(pg,tp.prims,x=>ox+x,y=>top+(y1-y));scaleCheck(pg,m,ph-m-2);return {pdf:doc.output(),pages:1};}
  const [a,b]=fmt==="A3"?[297,420]:[210,297];
  for(const [pw,ph] of [[a,b],[b,a]]){if(W<=pw-2*m&&H<=ph-2*m-head-foot){const pg=doc.page(pw,ph);header(pg);const ox=(pw-W)/2-x0,top=m+head+(ph-2*m-head-foot-H)/2;renderPrims(pg,tp.prims,x=>ox+x,y=>top+(y1-y));scaleCheck(pg,m,ph-m-2);return {pdf:doc.output(),pages:1};}}
  const {L,tiles,nUsed}=tileLayout(tp,fmt),ov=10;
  if(nUsed>80) return {err:`Il faudrait ${nUsed} pages : choisis A3 ou « une seule feuille » pour une reprographie.`};
  const info=doc.page(a,b);header(info);
  info.text("Assemblage",m,m+30,10,{bold:true});
  [`1. Imprime les ${nUsed+1} pages à 100 % (taille réelle). Les cases vides du plan ne sont pas imprimées.`,"2. Contrôle la barre de 100 mm au réglet.","3. Coupe la marge d'une page sur le trait fin et superpose-la de 10 mm sur la voisine,","   en faisant coïncider les croix (tous les 50 mm) et les traits. Scotche."].forEach((t,i)=>info.text(t,m,m+37+i*5.5,8));
  const s=Math.min((a-2*m)/W,(b-120-m)/H),gx=m,gy=m+65,tpt=clamp(Math.min(L.aw,L.ah)*s*0.3,6,14);
  renderPrims(info,tp.prims.filter(p=>p.t!=="text"),x=>gx+(x-x0)*s,y=>gy+(y1-y)*s);
  tiles.forEach(t=>{const lx=t.tx-x0,ly=y1-t.tyTop,w=Math.min(L.aw,W-lx),h=Math.min(L.ah,H-ly);info.lw(t.used?0.35:0.12);info.rgb(t.used?[185,80,12]:[200,204,208]);info.dash(t.used?null:[1,1]);info.rect(gx+lx*s,gy+ly*s,w*s,h*s);info.dash(null);
    if(t.used)info.text(String(t.no),gx+(lx+w/2)*s,gy+(ly+h/2)*s,tpt,{align:"center",bold:true,color:[185,80,12]});});
  scaleCheck(info,m,b-m-2);
  tiles.filter(t=>t.used).forEach(t=>{
    const pg=doc.page(L.pw,L.ph),tx=t.tx,tyTop=t.tyTop,X=x=>m+(x-tx),Y=y=>m+6+(tyTop-y);
    pg.text(`${tp.title} · page ${t.no} / ${nUsed+1} · colonne ${t.i+1}, ligne ${t.j+1} · échelle 1:1, 100 %`,m,m+1,7,{color:[90,96,102]});
    pg.lw(0.1);pg.rgb([180,186,190]);pg.rect(m,m+6,L.aw,L.ah);
    pg.clip(m,m+6,L.aw,L.ah);
    const reg=[];for(let gxm=Math.ceil(tx/50)*50;gxm<=tx+L.aw;gxm+=50)for(let gym=Math.ceil((tyTop-L.ah)/50)*50;gym<=tyTop;gym+=50)reg.push({t:"cross",c:[gxm,gym],s:2,w:0.15,col:[170,176,180]});
    renderPrims(pg,reg.concat(tp.prims),X,Y);pg.unclip();
  });
  return {pdf:doc.output(),pages:doc.count()};
}
const tplTool=id=>T.find(t=>t.id===id);
const band=(C,H,tab)=>[{t:"pl",pts:[[0,0],[C+tab,0],[C+tab,H],[0,H]],close:true,w:0.2},{t:"line",a:[C,0],b:[C,H],w:0.2,dash:[2,1.5]},{t:"text",p:[C+tab/2,H/2],str:"coller",pt:7,align:"center",col:GREY}];

tplTool("piquage").tpl=function(v){const D=v.D,d=v.d,be=v.be>0?v.be:90;if(!(D>0&&d>0&&d<=D&&be>=20&&be<=90))return null;
  const Rr=D/2,r=d/2,n=clamp(Math.round(v.n>=4?v.n:16),4,64),C=Math.PI*d,sb=Math.sin(rad(be)),cb=Math.cos(rad(be));
  const sF=th=>(Math.sqrt(Math.max(0,Rr*Rr-r*r*Math.sin(th)**2))-r*Math.cos(th)*cb)/sb;
  const N2=360,ys=[];for(let i=0;i<=N2;i++)ys.push(sF(2*Math.PI*i/N2));const mn=Math.min(...ys),curve=ys.map((s,i)=>[C*i/N2,s-mn]),ymax=Math.max(...curve.map(p=>p[1])),H=ymax+45,tab=15;
  const pr=[{t:"pl",pts:[[0,0],...curve,[C,0]],close:true,fill:0.86,w:0},...band(C,H,tab),{t:"pl",pts:curve,w:0.5}];
  for(let i=0;i<=n;i++){const x=C*i/n,y=sF(2*Math.PI*i/n)-mn;pr.push({t:"line",a:[x,0],b:[x,H],w:0.12,dash:[1,1.5],col:GREY},{t:"text",p:[x,-4],str:String(i%n),pt:7,align:"center"},{t:"text",p:[x+0.8,y+3],str:fmt(y,1),pt:5.5,col:GREY});}
  pr.push({t:"text",p:[3,H-5],str:`Piquage Ø ${fmt(d,1)} sur Ø ${fmt(D,1)} à ${fmt(be,0)}°`,pt:9,bold:true},{t:"text",p:[3,H-10],str:"Enroule sur le tube piqué, trait du bas au bout du tube. Gris = à enlever. Génératrice 0 dans le plan des axes.",pt:6.5});
  return {title:"Gabarit de piquage",file:`piquage-${fmt(d,1)}-sur-${fmt(D,1)}`,info:[["Tube principal","Ø "+fmt(D,1)],["Tube piqué","Ø "+fmt(d,1)],["Angle",fmt(be,0)+"°"],["Développé",fmt(C,1)+" mm"]],prims:pr,bbox:[0,-8,C+tab,H]};};

tplTool("generatrices").tpl=function(v){const D=v.D,n=Math.round(v.n);if(!(D>0&&n>=2&&n<=360))return null;const C=Math.PI*D,H=40,tab=15,pr=[...band(C,H,tab)];
  for(let i=0;i<=n;i++){const x=C*i/n;pr.push({t:"line",a:[x,0],b:[x,H],w:i%n===0?0.4:0.25},{t:"text",p:[x,-4],str:String(i%n),pt:7,align:"center"});}
  pr.push({t:"text",p:[3,H-5],str:`Ø ${fmt(D,1)} · ${n} génératrices · pas ${fmt(C/n,2)} mm`,pt:8,bold:true});
  return {title:"Bande de génératrices",file:`generatrices-${fmt(D,1)}`,info:[["Ø",fmt(D,1)],["Divisions",String(n)],["Développé",fmt(C,1)+" mm"]],prims:pr,bbox:[0,-8,C+tab,H]};};

tplTool("segments").tpl=function(v){const D=v.D,Rr=v.R,th=v.th,n=Math.round(v.n);if(!(D>0&&Rr>0&&th>0&&th<=180&&n>=2&&n<=12))return null;
  const b=rad(th/(2*(n-1))),tb=Math.tan(b),h=D/2,C=Math.PI*D,tab=15,N2=240,pr=[];let yoff=0;
  const cutEnd=[];for(let i=0;i<=N2;i++){const ph=2*Math.PI*i/N2;cutEnd.push([C*i/N2,h*(1-Math.cos(ph))*tb]);}
  const H1=2*h*tb+35;pr.push(...band(C,H1,tab),{t:"pl",pts:[[0,0],...cutEnd,[C,0]].map(p=>[p[0],p[1]]),close:true,fill:0.86,w:0},{t:"pl",pts:cutEnd,w:0.5},{t:"text",p:[3,H1-5],str:`Coupe d'onglet à ${fmt(deg(b),2)}° (pièces des bouts ×2) · Ø ${fmt(D,1)}`,pt:8,bold:true},{t:"text",p:[3,H1-10],str:"Enroule sur le tube, trait du bas au bout coupé d'équerre. Gris = à enlever. 0 = dos (extrados), 6 = ventre.",pt:6.5});
  for(let k=0;k<=12;k++){const x=C*k/12;pr.push({t:"line",a:[x,0],b:[x,H1],w:0.12,dash:[1,1.5],col:GREY},{t:"text",p:[x,-4],str:String(k%12),pt:6.5,align:"center"});}
  let y0=-8;
  if(n>2){const Lm=2*tb*(Rr+h),H2=Lm+30,base=-(H2+18),top=[],bot=[];for(let i=0;i<=N2;i++){const ph=2*Math.PI*i/N2,L=2*tb*(Rr+h*Math.cos(ph));top.push([C*i/N2,base+15+(Lm/2)+L/2]);bot.push([C*i/N2,base+15+(Lm/2)-L/2]);}
    pr.push({t:"pl",pts:[[0,base],[C+tab,base],[C+tab,base+H2],[0,base+H2]],close:true,w:0.2},{t:"line",a:[C,base],b:[C,base+H2],w:0.2,dash:[2,1.5]},{t:"line",a:[0,base+15+Lm/2],b:[C,base+15+Lm/2],w:0.2,dash:[3,2],col:GREY},{t:"pl",pts:top,w:0.5},{t:"pl",pts:bot,w:0.5},{t:"text",p:[3,base+H2-4],str:`Pièce centrale du coude (×${n-2}) · dos ${fmt(2*(Rr+h)*tb,1)} · ventre ${fmt(2*(Rr-h)*tb,1)}`,pt:8,bold:true},{t:"text",p:[3,base+H2-9],str:"Enroule sur le tube : la pièce est entre les deux courbes, pointillé = repère au milieu. Bord gauche = dos.",pt:6.5});
    y0=base-4;}
  return {title:"Gabarits du coude à segments",file:`coude-segments-${fmt(D,1)}`,info:[["Ø",fmt(D,1)],["Rayon",fmt(Rr,0)],["Angle",fmt(th,0)+"°"],["Pièces",String(n)]],prims:pr,bbox:[0,y0,C+tab,H1]};};

tplTool("cintrageplat").tpl=function(v){const {b,e}=v;if(!(b>0&&e>0))return null;const pr=[];let bb;
  if(v.mode==="volute"){const {De,Do,tours}=v;if(!(De>Do&&Do>=0&&tours>0))return null;const N2=Math.round(tours*120),pts=[];for(let i=0;i<=N2;i++){const t=i/N2,a=2*Math.PI*tours*t,r=Do/2+(De-Do)/2*t;pts.push([r*Math.cos(a),r*Math.sin(a)]);}
    pr.push({t:"pl",pts,w:0.6},{t:"cross",c:[0,0],s:5,w:0.3},{t:"text",p:[0,-De/2-8],str:`Volute Ø ${fmt(De,0)} · œil Ø ${fmt(Do,0)} · ${fmt(tours,1)} tours`,pt:8,bold:true,align:"center"},{t:"text",p:[0,-De/2-13],str:"Trait = axe du plat. Pose le gabarit sous le marbre ou trace-le à la craie, centre sur la croix.",pt:6.5,align:"center"});const sb=bbox(pts);bb=[Math.min(sb[0],-58)-2,-De/2-17,Math.max(sb[2],58)+2,sb[3]+2];
    return {title:"Gabarit de volute",file:`volute-${fmt(De,0)}`,info:[["Plat",`${fmt(b,0)} × ${fmt(e,0)}`],["Longueur de fer",fmt(Math.PI*tours*(De+Do)/2,0)+" mm"]],prims:pr,bbox:bb};}
  const Di=v.Di;if(!(Di>0))return null;const t=v.sens==="plat"?e:b,ri=Di/2,ro=ri+t,a=v.mode==="arc"?(v.ang>0?v.ang:90):360;
  const arcI=arcPts([0,0],ri,90-a/2,90+a/2,180),arcO=arcPts([0,0],ro,90-a/2,90+a/2,180);
  pr.push({t:"pl",pts:arcI,w:0.5},{t:"pl",pts:arcO,w:0.25,dash:[2,1.5]},{t:"cross",c:[0,0],s:5,w:0.3},{t:"text",p:[0,ri-10],str:`Ø intérieur ${fmt(Di,0)} (trait plein) · Ø extérieur ${fmt(Di+2*t,0)} (pointillé)`,pt:7.5,align:"center"});

tplTool("cone").tpl=function(v){const {D,H,t}=v,d=v.d>0?v.d:0;if(!(D>0&&H>0&&t>=0))return null;const adj=v.ref==="ext"?-t:v.ref==="int"?t:0,Dm=D+adj,dm=d>0?d+adj:0;if(!(Dm>dm))return null;

  const lab=r>0?(r+Rr)/2-9:Rr*0.55;if(r>0)pr.push({t:"text",p:[0,-lab+18],str:`Centre des arcs à ${fmt(Rr,1)} mm du grand arc, sur l'axe.`,pt:6.5,align:"center",col:GREY});pr.push({t:"text",p:[0,-lab-12],str:`${n>1?`Une partie, à tracer ${n} fois · `:""}R ${fmt(Rr,1)} · r ${fmt(r,1)} · ${fmt(thp,2)}°`,pt:8,bold:true,align:"center"},{t:"text",p:[0,-lab-18],str:"Ajoute les surépaisseurs de soudure et d'agrafage si besoin.",pt:6.5,align:"center"});

tplTool("reduction").tpl=function(v){const r=this.calc(v);if(!r||r.err)return null;
  const {D1,D2,H,t}=v,adj=v.ref==="ext"?-t:v.ref==="int"?t:0,R1=(D1+adj)/2,R2=(D2+adj)/2;let n=Math.round(v.n>=8?v.n:24);n=clamp(n+(n%2),8,72);const e=v.type==="exc"?R1-R2:0;
  const B=i=>{const f=Math.PI+2*Math.PI*i/n;return [R1*Math.cos(f),R1*Math.sin(f),0];},Tt=i=>{const f=Math.PI+2*Math.PI*i/n;return [e+R2*Math.cos(f),R2*Math.sin(f),H];};
  const Bp=[[0,0]],Tp=[[0,d3(B(0),Tt(0))]];for(let i=0;i<n;i++){const b1=inter2(Bp[i],d3(B(i+1),B(i)),Tp[i],d3(B(i+1),Tt(i)),[Bp[i],Tp[i]],-1);Bp.push(b1);Tp.push(inter2(Tp[i],d3(Tt(i+1),Tt(i)),b1,d3(Tt(i+1),B(i+1)),[b1,Tp[i]],-1));}
  const pr=[{t:"pl",pts:Bp.concat(Tp.slice().reverse()),close:true,w:0.5}];for(let i=1;i<n;i++)pr.push({t:"line",a:Bp[i],b:Tp[i],w:0.12,dash:[1.5,1.5],col:GREY});
  for(let i=0;i<=n;i+=2)pr.push({t:"text",p:[Bp[i][0],Bp[i][1]-4],str:String(i),pt:6,align:"center",col:GREY});
  const bb=bbox(Bp.concat(Tp));pr.push({t:"text",p:[(bb[0]+bb[2])/2,bb[3]+5],str:`Réduction ${v.type==="exc"?"excentrée":"concentrique"} Ø ${fmt(D1,1)} → Ø ${fmt(D2,1)} · L ${fmt(H,0)}`,pt:8,bold:true,align:"center"});
  return {title:"Développé de réduction",file:`reduction-${fmt(D1,0)}-${fmt(D2,0)}`,info:[["Grand Ø",fmt(D1,1)],["Petit Ø",fmt(D2,1)],["Longueur",fmt(H,0)]],prims:pr,bbox:[bb[0]-5,bb[1]-8,bb[2]+5,bb[3]+9]};};

tplTool("tremie").tpl=function(v){const {A,B,a,b,H}=v;if(!(A>0&&B>0&&a>=0&&b>=0&&H>0))return null;const h1=Math.hypot(H,(B-b)/2),h2=Math.hypot(H,(A-a)/2),gap=20,ox=A/2+gap+B/2;
  const f1=[[-A/2,h1],[A/2,h1],[a/2,0],[-a/2,0]],f2=[[ox-B/2,h2],[ox+B/2,h2],[ox+b/2,0],[ox-b/2,0]];
  const pr=[{t:"pl",pts:f1,close:true,w:0.5},{t:"pl",pts:f2,close:true,w:0.5},{t:"text",p:[0,h1/2],str:`Face A ×2 · h ${fmt(h1,1)}`,pt:8,bold:true,align:"center"},{t:"text",p:[ox,h2/2],str:`Face B ×2 · h ${fmt(h2,1)}`,pt:8,bold:true,align:"center"}];

tplTool("arc").tpl=function(v){const {c,f}=v;if(!(c>0&&f>0&&f<=c/2))return null;const Rr=(c*c/4+f*f)/(2*f),cv=v.sens==="conv"?1:-1,y=x=>cv*(Math.sqrt(Math.max(0,Rr*Rr-(x-c/2)**2))-(Rr-f));

function buildInputs(t,o){const v={};t.inputs.forEach(f=>{v[f.k]=f.t==="n"?parseNum(o[f.k]):o[f.k];});

  t.inputs.filter(f=>f.t==="rows").forEach(f=>{inputs.push([f.l,(o[f.k]||[]).filter(r=>String(r[0]).trim()).map(r=>`${r[0]} × ${r[1]}`).join(", "),""]);});return inputs;}

function offerFile(name,data){
  const ext=name.split(".").pop().toLowerCase(),type={pdf:"application/pdf",svg:"image/svg+xml",json:"application/json",html:"text/html"}[ext]||"text/plain";
  const blob=data instanceof Blob?data:new Blob([data],{type});
  try{const file=new File([blob],name,{type});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});return;}}catch(e){}
  try{const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},4000);}catch(e){toast("Le fichier n'a pas pu être créé.");}
}

function drawAcc(G,t,M,u,n,k){const q=(a,b)=>[M[0]+u[0]*a*k+n[0]*b*k,M[1]+u[1]*a*k+n[1]*b*k],bow=()=>G.poly([q(-9,6),q(-9,-6),q(9,6),q(9,-6)],"sym","paper");
  switch(t){

    case "v3":bow();G.poly([q(0,0),q(-6,-12),q(6,-12)],"sym","paper");break;
    case "papillon":G.line(q(-5,8),q(-5,-8),"sym");G.line(q(5,8),q(5,-8),"sym");G.circle(M,4*k,"sym","paper");G.line(q(-3,3),q(3,-3),"sym");break;
    case "filtre":G.poly([q(-8,5),q(8,5),q(8,-5),q(-8,-5)],"sym","paper");G.line(q(-3,-5),q(4,-14),"sym");G.line(q(3,-5),q(10,-14),"sym");G.line(q(4,-14),q(10,-14),"sym");break;
    case "purgeur":G.poly([q(-7,7),q(7,7),q(7,-7),q(-7,-7)],"sym","paper");G.circle(M,3.5*k,"sym","ink");break;
    case "compteur":G.circle(M,8*k,"sym","paper");G.text(M,"M",9*k,"middle",true,"ink");break;
    case "pompe":G.circle(M,9*k,"sym","paper");G.poly([q(-4,5),q(-4,-5),q(6,0)],"sym","ink");break;
    case "reduc":G.poly([q(-8,7),q(8,4),q(8,-4),q(-8,-7)],"sym","paper");break;
    case "reducx":G.poly([q(-8,7),q(8,7),q(8,-1),q(-8,-7)],"sym","paper");break;
    case "bride":G.poly([q(-4,7),q(4,7),q(4,-7),q(-4,-7)],"sym","paper");G.line(q(-2,7),q(-2,-7),"sym");G.line(q(2,7),q(2,-7),"sym");break;
    case "comp":G.poly([q(-9,6),q(9,6),q(9,-6),q(-9,-6)],"sym","paper");[-5,0,5].forEach(x=>G.line(q(x-2,6),q(x+2,-6),"sym"));break;
    case "mano":G.line(M,q(0,-12),"sym");G.circle(q(0,-18),6*k,"sym","paper");G.line(q(0,-18),q(3,-21),"sym");break;
    case "thermo":G.line(M,q(0,-10),"sym");G.poly([q(-2.5,-10),q(2.5,-10),q(2.5,-22),q(-2.5,-22)],"sym","paper");G.circle(q(0,-10),3*k,"sym","ink");break;
    case "event":G.line(M,q(0,-8),"sym");G.poly([q(-5,-8),q(5,-8),q(-5,-18),q(5,-18)],"sym","paper");break;
    case "soupape":G.line(M,q(0,-8),"sym");G.poly([q(-5,-8),q(5,-8),q(0,-16)],"sym","paper");G.line(q(0,-16),q(0,-25),"sym");G.line(q(-3,-19),q(3,-21),"sym");G.line(q(-3,-22),q(3,-24),"sym");break;

function drawEnd(G,t,p,u,n,k){const q=(a,b)=>[p[0]+u[0]*a*k+n[0]*b*k,p[1]+u[1]*a*k+n[1]*b*k];
  if(t==="bride"){G.line(q(0,8),q(0,-8),"sym");G.line(q(3,8),q(3,-8),"sym");}
  else if(t==="pleine"){G.poly([q(0,8),q(4,8),q(4,-8),q(0,-8)],"sym","ink");}
  else if(t==="fond"){const pts=[];for(let i=0;i<=12;i++){const a=-Math.PI/2+Math.PI*i/12;pts.push(q(Math.cos(a)*6,Math.sin(a)*7));}G.poly(pts,"sym","paper");}
  else if(t==="bouchon"){G.poly([q(0,5),q(5,5),q(5,-5),q(0,-5)],"sym","ink");}}

function project(p,v){const ps=rad(v.yaw),ph=rad(v.pitch);return [p[0]*Math.cos(ps)+p[1]*Math.sin(ps),(-p[0]*Math.sin(ps)+p[1]*Math.cos(ps))*Math.sin(ph)+p[2]*Math.cos(ph)];}
function newIso(name){return {id:newId(),kind:"iso",name:name||"Ligne",job:Store.active||null,D:60.3,R:76,tee:"te",C:64,gap:2,mat:"acier",page:"A4",nums:true,dims:true,created:Date.now(),segs:[]};}
function exampleIso(){const i=newIso("Exemple — ligne L-01");i.segs=[{d:"E",L:1500,f:0},{d:"N",L:800,f:1,acc:"vanne",accL:150},{d:"H",L:600,f:2},{d:"E",L:1200,f:3,accs:[{t:"mano",pos:400,L:0}]},{d:"S",L:500,f:1}];i.ends={"4":{t:"bride",L:0},"5":{t:"pleine",L:0}};return i;}

/* ---- analyse : nœuds, pièces à couper, soudures, nomenclature ---- */
function analyseIso(iso){
  const segs=iso.segs||[],P=[[0,0,0]],V=[];
  segs.forEach((s,i)=>{const v=segVec(s);V.push(v);P[i+1]=v3.add(P[s.f]||[0,0,0],v,s.L);});
  const inc=P.map(()=>[]);
  segs.forEach((s,i)=>{inc[s.f].push({i,end:0,u:V[i]});inc[i+1].push({i,end:1,u:V[i].map(c=>-c)});});
  const R=iso.R>0?iso.R:0,Ct=iso.C>0?iso.C:0,gap=iso.gap>0?iso.gap:0,piq=iso.tee==="piq",D=iso.D>0?iso.D:0;
  const warn=[];
  const nodes=inc.map(list=>{const d=list.length;
    if(d===0)return {type:"vide",list}; if(d===1)return {type:"libre",list};
    if(d===2){const th=180-deg(Math.acos(clamp(v3.dot(list[0].u,list[1].u),-1,1)));if(th<0.5)return {type:"droit",list};if(th>170)warn.push("Un tronçon revient sur le précédent (demi-tour) : vérifie les directions.");return {type:"coude",th,list};}
    if(d===3){for(let p=0;p<3;p++)for(let q=p+1;q<3;q++)if(v3.dot(list[p].u,list[q].u)<-0.999)return {type:"te",run:[p,q],br:3-p-q,list};return {type:"te",run:null,list};}
    return {type:"croix",list};});
  const info=(n,ix)=>{const nd=nodes[n];
    if(nd.type==="libre"){const en=(iso.ends||{})[n];if(en&&en.t&&en.t!=="libre"&&ENDN[en.t]){const tk=en.L>0?en.L:0;return en.t==="bouchon"?{take:tk,g:0,kind:"end",note:"bouchon fileté"}:{take:tk,g:gap,kind:"end",note:ENDN[en.t].toLowerCase()};}return {take:0,g:0,kind:"libre",note:"bout libre"};}
    if(nd.type==="droit")return {take:0,g:0,merge:true};
    if(nd.type==="coude")return R>0?{take:R*Math.tan(rad(Math.min(nd.th,170)/2)),g:gap,kind:"coude",note:`coude ${fmt(nd.th,0)}°`}:{take:0,g:gap/2,kind:"onglet",note:`onglet ${fmt(nd.th/2,1)}°`};
    if(nd.type==="te"&&piq&&nd.run){if(ix===nd.br)return {take:0,g:0,kind:"piquage",note:"gueule de loup"};return {take:0,g:0,merge:true};}
    return {take:Ct,g:gap,kind:"te",note:nd.type==="croix"?"croix":"té"};};
  const subs=[],segSubs=[];let overlap=false;
  segs.forEach((s,i)=>{
    const e0={node:s.f,ix:nodes[s.f].list.findIndex(e=>e.i===i&&e.end===0)},e1={node:i+1,ix:nodes[i+1].list.findIndex(e=>e.i===i&&e.end===1)};
    e0.inf=info(e0.node,e0.ix);e1.inf=info(e1.node,e1.ix);
    const ins=accList(s).filter(x=>INLINE[x.t]!==undefined).map(x=>({t:x.t,L:x.L||0,pos:clamp(x.pos,0,s.L)})).sort((x,y)=>x.pos-y.pos);
    const first=subs.length;let st=0,pe=e0;
    ins.forEach(x=>{const ea={inf:{take:0,g:gap,kind:"acc",note:(ACCN[x.t]||"accessoire").toLowerCase()}};const raw=x.pos-x.L/2-st;if(raw<-0.01)overlap=true;subs.push({i,raw,ends:[pe,ea]});st=x.pos+x.L/2;pe=ea;});
    if(s.L-st<-0.01)overlap=true;subs.push({i,raw:s.L-st,ends:[pe,e1]});segSubs[i]=[first,subs.length-1];
  });
  const par=subs.map((_,k)=>k),find=k=>par[k]===k?k:(par[k]=find(par[k])),uni=(a,b)=>{a=find(a);b=find(b);if(a!==b)par[Math.max(a,b)]=Math.min(a,b);};
  nodes.forEach(nd=>{const pair=nd.type==="droit"?[0,1]:(nd.type==="te"&&piq&&nd.run)?nd.run:null;if(!pair)return;
    const sb=pair.map(ix=>{const e=nd.list[ix];return e.end===0?segSubs[e.i][0]:segSubs[e.i][1];});uni(sb[0],sb[1]);});
  const groups={};subs.forEach((sb,k)=>{const r=find(k);(groups[r]=groups[r]||[]).push(k);});
  const pieces=Object.keys(groups).map(r=>{const ks=groups[r];let len=0;const notes=[],si=new Set();
    ks.forEach(k=>{const sb=subs[k];len+=sb.raw;si.add(sb.i);sb.ends.forEach(e=>{if(e.inf.merge)return;len-=e.inf.take+e.inf.g;notes.push(e.inf.note);});});
    return {len,notes,segs:[...si].sort((a,b)=>a-b),first:Math.min(...ks)};}).sort((a,b)=>a.first-b.first);
  pieces.forEach((p,k)=>{p.rep="P"+(k+1);});
  const welds=[],done=new Set();
  const nodeW=n=>{if(done.has(n))return;done.add(n);const nd=nodes[n],p=P[n];
    if(nd.type==="coude"){if(R>0)nd.list.forEach(e=>welds.push({p:v3.add(p,e.u,R*Math.tan(rad(Math.min(nd.th,170)/2))),seg:e.i,dir:e.u}));else welds.push({p,seg:nd.list[0].i});}
    else if(nd.type==="te"||nd.type==="croix"){if(piq&&nd.type==="te"&&nd.run){const e=nd.list[nd.br];welds.push({p:v3.add(p,e.u,D/2),seg:e.i,dir:e.u});}else nd.list.forEach(e=>welds.push({p:v3.add(p,e.u,Ct),seg:e.i,dir:e.u}));}
    else if(nd.type==="libre"){const en=(iso.ends||{})[n];if(en&&["bride","pleine","fond"].includes(en.t)){const e=nd.list[0];welds.push({p:v3.add(p,e.u,en.L>0?en.L:0),seg:e.i});}}};
  segs.forEach((s,i)=>{nodeW(s.f);accList(s).slice().sort((x,y)=>x.pos-y.pos).forEach(x=>{const m=v3.add(P[s.f],V[i],clamp(x.pos,0,s.L));if(INLINE[x.t]!==undefined){const h=(x.L||0)/2;welds.push({p:v3.add(m,V[i],-h),seg:i,dir:V[i].map(c=>-c)},{p:v3.add(m,V[i],h),seg:i,dir:V[i]});}else welds.push({p:m,seg:i});});nodeW(i+1);});
  welds.forEach((w,k)=>w.n=k+1);
  const tot=pieces.reduce((a,p)=>a+Math.max(0,p.len),0),bom=[];
  if(segs.length) bom.push([`Tube Ø ${fmt(D,1)} ${MATN[iso.mat]||""}`.trim(),`${fmt(tot/1000,2)} m`]);
  const el={};nodes.forEach(nd=>{if(nd.type==="coude"){const k=Math.round(nd.th*10)/10;el[k]=(el[k]||0)+1;}});
  Object.keys(el).sort((a,b)=>b-a).forEach(k=>bom.push([R>0?`Coude ${fmt(+k,1)}° R ${fmt(R,0)}`:`Angle ${fmt(+k,1)}° en onglet (coupes à ${fmt(k/2,1)}°)`,String(el[k])]));
  const nte=nodes.filter(nd=>nd.type==="te").length,ncx=nodes.filter(nd=>nd.type==="croix").length;
  if(nte) bom.push([piq?"Piquage direct (gueule de loup)":"Té égal",String(nte)]);
  if(ncx) bom.push(["Croix",String(ncx)]);
  const ac={};segs.forEach(s=>accList(s).forEach(x=>{ac[x.t]=(ac[x.t]||0)+1;}));Object.keys(ac).forEach(k=>bom.push([ACCN[k]||k,String(ac[k])]));
  const ec={};Object.keys(iso.ends||{}).forEach(k=>{const en=iso.ends[k];if(en&&en.t&&en.t!=="libre"&&nodes[k]&&nodes[k].type==="libre")ec[en.t]=(ec[en.t]||0)+1;});Object.keys(ec).forEach(k=>bom.push([ENDN[k],String(ec[k])]));
  if(overlap)warn.push("Des accessoires se chevauchent ou dépassent d'un tronçon : vérifie leurs positions et longueurs.");
  if(welds.length) bom.push(["Soudures",String(welds.length)]);
  pieces.forEach(p=>{if(p.len<0)warn.push(`${p.rep} sort négative : un tronçon est trop court pour ses raccords.`);});
  if(nodes.some(nd=>nd.type==="te"&&!nd.run))warn.push("Un té n'est pas sur une ligne droite : vérifie les directions.");
  if(nodes.some(nd=>nd.type==="croix"))warn.push("Quatre tronçons ou plus se rejoignent sur un même point (croix).");
  return {P,V,nodes,pieces,welds,bom,warn,tot};
}

/* ---- dessin générique (écran SVG ou PDF) ---- */
function drawIso(G,iso,A,o){
  const k=o.k,view=o.view||ISOVIEW,segs=iso.segs||[];
  const Q=A.P.map(p=>project(p,view));
  const bb=bbox(Q),bw=bb[2]-bb[0],bh=bb[3]-bb[1],pad=o.pad*k;
  let s0=Math.min((o.W-2*pad)/Math.max(bw,1e-6),(o.H-2*pad)/Math.max(bh,1e-6));
  if(!isFinite(s0)||(bw<1e-6&&bh<1e-6)) s0=1;
  const s=s0*(o.zoom||1),cx=(bb[0]+bb[2])/2,cy=(bb[1]+bb[3])/2,pan=o.pan||[0,0];
  const T=q=>[o.x0+o.W/2+(q[0]-cx)*s+pan[0],o.y0+o.H/2-(q[1]-cy)*s+pan[1]];
  const S=Q.map(T),C=S.reduce((a,p)=>[a[0]+p[0]/S.length,a[1]+p[1]/S.length],[0,0]);

  const at=(p,u,t,n,w)=>[p[0]+u[0]*t+(n?n[0]*w:0),p[1]+u[1]*t+(n?n[1]*w:0)];
  // nord
  if(o.north!==false){const q=project([0,1,0],view),ql=Math.hypot(q[0],q[1]);if(ql>0.08){const d=[q[0]/ql,-q[1]/ql],b=[o.x0+24*k,o.y0+28*k],tp=at(b,d,18*k),nn=[d[1],-d[0]];
    G.line(b,tp,"north");G.poly([tp,at(tp,d,-6*k,nn,3*k),at(tp,d,-6*k,nn,-3*k)],"north","muted");G.text(at(tp,d,8*k),"N",10*k,"middle",true,"muted");}}
  // tubes
  segs.forEach((sg,i)=>G.line(geo[i].a,geo[i].b,o.sel===i?"pipeSel":"pipe",i));
  // accessoires
  segs.forEach((sg,i)=>{const g=geo[i];accList(sg).forEach(x=>{const pt=v3.add(A.P[sg.f],A.V[i],clamp(x.pos,0,sg.L)),M=T(project(pt,view));drawAcc(G,x.t,M,g.u,[g.u[1],-g.u[0]],k);});});
  // extrémités
  Object.keys(iso.ends||{}).forEach(key=>{const en=iso.ends[key],nd=A.nodes[key];if(!en||!nd||nd.type!=="libre"||en.t==="libre")return;const e=nd.list[0],g=geo[e.i];if(!g)return;const u0=e.end===0?[-g.u[0],-g.u[1]]:g.u;drawEnd(G,en.t,S[key],u0,[u0[1],-u0[0]],k);});
  // cotes
  if(o.dims!==false) segs.forEach((sg,i)=>{const g=geo[i];if(g.L<4*k)return;const off=17*k,n=g.n,u=g.u,A2=at(g.a,[0,0],0,n,off),B2=at(g.b,[0,0],0,n,off);
    G.line(at(g.a,[0,0],0,n,3*k),at(A2,[0,0],0,n,3*k),"ext");G.line(at(g.b,[0,0],0,n,3*k),at(B2,[0,0],0,n,3*k),"ext");G.line(A2,B2,"dim");
    const tk=[(u[0]+n[0])*2.4*k,(u[1]+n[1])*2.4*k];[A2,B2].forEach(p=>G.line([p[0]-tk[0],p[1]-tk[1]],[p[0]+tk[0],p[1]+tk[1]],"dim"));
    const anc=Math.abs(n[0])>0.8?(n[0]>0?"start":"end"):"middle";G.text(at(g.m,[0,0],0,n,off+(anc==="middle"?8:5)*k),fmt(sg.L,0),11*k,anc,true,"ink");});
  // repères de tronçon
  if(o.segnums!==false) segs.forEach((sg,i)=>{const g=geo[i];if(g.L<14*k)return;const p=at(g.m,[0,0],0,g.n,-11*k);G.text(accList(sg).length?at(p,g.u,-16*k):p,"T"+(i+1),8.5*k,"middle",false,"muted");});
  // nœuds
  A.nodes.forEach((nd,j)=>{const p=S[j],en=(iso.ends||{})[j];if(nd.type==="libre"&&!(en&&en.t&&en.t!=="libre"))G.circle(p,3.2*k,"sym","paper");else if(nd.type==="te"||nd.type==="croix")G.circle(p,3*k,"sym","ink");});
  if(segs.length){const g0=geo[0];G.text(at(S[0],g0.u,-12*k,g0.n,0),"A",11*k,"middle",true,"accent");}
  if(o.start!=null&&S[o.start]) G.circle(S[o.start],7*k,"start","none");
  // soudures
  A.welds.forEach(w=>{const p=T(project(w.p,view)),g=geo[w.seg];G.circle(p,2.3*k,"sym","ink");
    if(o.nums!==false&&g){let d=[0,0];if(w.dir){const q=T(project(v3.add(w.p,w.dir,1),view)),ql=Math.hypot(q[0]-p[0],q[1]-p[1]);if(ql>1e-9)d=[(q[0]-p[0])/ql,(q[1]-p[1])/ql];}const b=at(p,d,9*k,g.n,-13*k);G.line(at(p,[0,0],0,g.n,-2.5*k),at(b,[0,0],0,g.n,6.5*k),"ext");G.circle(b,6.5*k,"sym","paper");G.text(b,String(w.n),8*k,"middle",true,"ink");}});
  return {S,geo};
}

function svgAdapter(){
  const o=[],hits=[],F=n=>n.toFixed(1),pts=p=>p.map(q=>F(q[0])+","+F(q[1])).join(" ");
  return {
    line(a,b,st,seg){o.push(`<line class="i-${st}" x1="${F(a[0])}" y1="${F(a[1])}" x2="${F(b[0])}" y2="${F(b[1])}"/>`);if(seg!=null)hits.push(`<line class="i-hit" data-seg="${seg}" x1="${F(a[0])}" y1="${F(a[1])}" x2="${F(b[0])}" y2="${F(b[1])}"/>`);},
    poly(p,st,fill){o.push(`<polygon class="i-${st} f-${fill||"none"}" points="${pts(p)}"/>`);},
    circle(c,r,st,fill){o.push(`<circle class="i-${st} f-${fill||"none"}" cx="${F(c[0])}" cy="${F(c[1])}" r="${F(r)}"/>`);},
    text(p,str,size,anc,bold,col){o.push(`<text class="i-t${bold?" b":""} c-${col||"ink"}" x="${F(p[0])}" y="${F(p[1])}" font-size="${F(size)}" text-anchor="${anc||"middle"}" dominant-baseline="central">${esc(str)}</text>`);},
    out(){return o.join("")+hits.join("");}
  };
}

/* ---- mini générateur PDF vectoriel (Helvetica, WinAnsi) ---- */
const HW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];

function pdfSafe(s){return String(s).replace(/[   ]/g," ").replace(/[—–]/g,"-").replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/≈/g,"~").replace(/…/g,"...").replace(/œ/g,"oe").replace(/[^\x20-\xff]/g,"?");}
function MiniPDF(wmm,hmm){

    style(lw,stroke,fill){if(lw!=null)ops.push(`${N(lw)} w`);if(stroke)ops.push(`${c3(stroke)} RG`);if(fill)ops.push(`${c3(fill)} rg`);},
    line(a,b){ops.push(`${N(a[0])} ${Yp(a[1])} m ${N(b[0])} ${Yp(b[1])} l S`);},

    circle(c,r,mode){const k=0.5523*r,[x,y]=c;const pt=(a,b)=>`${N(a)} ${Yp(b)}`;ops.push(`${pt(x+r,y)} m ${pt(x+r,y+k)} ${pt(x+k,y+r)} ${pt(x,y+r)} c ${pt(x-k,y+r)} ${pt(x-r,y+k)} ${pt(x-r,y)} c ${pt(x-r,y-k)} ${pt(x-k,y-r)} ${pt(x,y-r)} c ${pt(x+k,y-r)} ${pt(x+r,y-k)} ${pt(x+r,y)} c h ${mode||"S"}`);},
    text(str,x,y,pt,o={}){const w=P.width(str,pt,o.bold),xx=o.align==="center"?x-w/2:o.align==="right"?x-w:x;const yy=o.base?y:y+pt/K*0.35;ops.push(`BT /${o.bold?"F2":"F1"} ${pt.toFixed(2)} Tf ${c3(o.color||[20,24,28])} rg ${N(xx)} ${Yp(yy)} Td (${enc(str)}) Tj ET`);},
    output(){const content=ops.join("\n"),objs=[];
      objs.push("<< /Type /Catalog /Pages 2 0 R >>");
      objs.push("<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
      objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${N(wmm)} ${N(hmm)}] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>`);
      objs.push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
      objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
      objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");

      const xr=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(x=>String(x).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;return out;}
  };
  return P;
}
function pdfAdapter(P){
  const INK=[20,24,28],MUT=[105,114,122],ACC=[185,80,12],W=[255,255,255];
  const ST={pipe:[.55,INK],pipeSel:[.55,INK],dim:[.12,MUT],ext:[.12,MUT],sym:[.25,INK],north:[.25,MUT],start:[.2,ACC]};
  const fillC={ink:INK,paper:W,muted:MUT,accent:ACC};
  return {
    line(a,b,st){const s=ST[st]||ST.sym;P.style(s[0],s[1]);P.line(a,b);},
    poly(p,st,fill){const s=ST[st]||ST.sym;P.style(s[0],s[1],fillC[fill]||null);P.poly(p,fill&&fill!=="none"?"B":"S");},
    circle(c,r,st,fill){if(st==="start")return;const s=ST[st]||ST.sym;P.style(s[0],s[1],fillC[fill]||null);P.circle(c,r,fill&&fill!=="none"?"B":"S");},
    text(p,str,size,anc,bold,col){P.text(str,p[0],p[1],size*2.8346,{align:anc==="start"?"left":anc==="end"?"right":"center",bold,color:col==="muted"?MUT:col==="accent"?ACC:INK});}
  };
}
function isoPDF(iso){

  const px=W-m-pw;P.style(.3,INK);P.line([px,m],[px,H-m]);
  drawIso(pdfAdapter(P),iso,A,{W:px-m-6,H:H-2*m-6,x0:m+3,y0:m+3,k,view:ISOVIEW,pad:22,nums:iso.nums!==false,dims:iso.dims!==false});
  const x=px+4,cw=pw-8,fs=A3?8.5:7.2,lh=A3?4.6:3.9,cartH=A3?58:50,ymax=H-m-cartH-4;let y=m+7,cut=false;

  head("LISTE DE COUPE");
  P.text("Rep.",x,y,fs,{bold:true,color:MUT});P.text("Long. (mm)",x+30,y,fs,{bold:true,color:MUT,align:"right"});P.text("Tronçons",x+33,y,fs,{bold:true,color:MUT});P.text("Bouts",x+52,y,fs,{bold:true,color:MUT});y+=lh;
  for(const p of A.pieces){if(y>ymax-lh*6){cut=true;break;}
    P.text(p.rep,x,y,fs,{bold:true});P.text(fmt(p.len,0),x+30,y,fs,{align:"right",bold:true,color:p.len<0?ACC:INK});P.text(p.segs.map(i=>"T"+(i+1)).join("+"),x+33,y,fs);
    let nt=p.notes.join(" / ");while(nt.length>4&&P.width(nt,fs*.9)>cw-53)nt=nt.slice(0,-2);if(nt!==p.notes.join(" / "))nt+="…";P.text(nt,x+52,y,fs*.9,{color:MUT});y+=lh;}
  if(cut){P.text("(suite dans l'application)",x,y,fs,{color:MUT});y+=lh;}
  y+=lh*.8;head("NOMENCLATURE");

  if(y<ymax-lh*3){y+=lh*.6;const note=[`Longueurs sur l'axe, écart de soudure ${fmt(iso.gap||0,1)} mm déduit.`];if(!(iso.R>0))note.push("Onglets : longueur prise sur l'axe.");note.forEach(t=>{if(y<ymax){P.text(t,x,y,fs*.85,{color:MUT});y+=lh*.9;}});}
  const cy=H-m-cartH,job=Store.get(iso.job),rows=[["Plan",iso.name],["Chantier",job?job.name:""],["Tube",`Ø ${fmt(iso.D,1)} ${MATN[iso.mat]||""}`],["Coudes",iso.R>0?`R ${fmt(iso.R,0)} mm`:"Coupe d'onglet"],["Tés",iso.tee==="piq"?"Piquage direct":`Té, axe-bout ${fmt(iso.C,0)} mm`],["Date",fmtDate(Date.now())],["Échelle","Sans échelle"],["Dessiné par",""]];
  const rh=cartH/rows.length;P.style(.4,INK);P.rect(px,cy,pw,cartH);P.style(.15,MUT);
  rows.forEach((r,i)=>{const ry=cy+i*rh;if(i)P.line([px,ry],[px+pw,ry]);P.text(r[0],px+3,ry+rh/2,fs*.9,{color:MUT});let v=r[1];while(v.length>4&&P.width(v,fs,true)>pw-30)v=v.slice(0,-2);P.text(v,px+26,ry+rh/2,fs,{bold:i===0});});

    else{seg.f=Math.min(ED.start,iso.segs.length);iso.segs.push(seg);ED.sel=iso.segs.length-1;ED.start=iso.segs.length;}

    drawStage();});
  // gestes : glisser = déplacer (iso) ou tourner (3D), pincer = zoom, toucher un tronçon = le sélectionner
  const ptr=new Map();let g=null,raf=0;const redraw=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;drawStage();});};
  const svg=document.getElementById("isvg");

    if(ptr.size===1)g={t:"drag",p:[e.clientX,e.clientY],moved:false,seg:e.target.closest&&e.target.closest("[data-seg]")};
    else if(ptr.size===2){const [a,b]=[...ptr.values()];g={t:"pinch",d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:ED.view.zoom};}});

      sg.accs=accList(sg).concat([{t,pos,L:L||0}]);delete sg.acc;delete sg.accL;isoChanged(c);toast(`${ACCN[t]} ajouté sur T${i+1}.`);}
    else if(b.dataset.a==="delacc"){const c=JSON.parse(JSON.stringify(iso)),sg=c.segs[i];sg.accs=accList(sg);sg.accs.splice(+b.dataset.k,1);delete sg.acc;delete sg.accL;isoChanged(c);}});
  document.getElementById("selBox").addEventListener("change",e=>{const el=e.target,node=el.dataset.endt||el.dataset.endl;if(node==null)return;const c=JSON.parse(JSON.stringify(curIso()));c.ends=c.ends||{};const cur=c.ends[node]||{t:"libre",L:0};
    if(el.dataset.endt!=null)cur.t=el.value;else cur.L=Math.max(0,parseNum(el.value)||0);
    if(cur.t==="libre")delete c.ends[node];else c.ends[node]=cur;isoChanged(c);});
  const setBox=document.getElementById("setBox");
  const readSet=()=>{const iso=JSON.parse(JSON.stringify(curIso())),num=(id,d)=>{const v=parseNum(document.getElementById(id).value);return isFinite(v)&&v>=0?v:d;};
    iso.name=document.getElementById("sName").value.trim()||"Ligne";iso.job=document.getElementById("sJob").value||null;iso.D=num("sD",iso.D);iso.R=num("sR",0);iso.tee=document.getElementById("sTee").value;iso.C=num("sC",0);iso.gap=num("sGap",0);iso.mat=document.getElementById("sMat").value;iso.dims=document.getElementById("sDims").value==="1";iso.nums=document.getElementById("sNums").value==="1";iso.page=document.getElementById("sPage").value;
    document.getElementById("sCw").hidden=iso.tee==="piq";document.getElementById("isoH").textContent=iso.name;isoChanged(iso);};
  setBox.addEventListener("input",readSet);setBox.addEventListener("change",readSet);
  document.getElementById("sCw").hidden=curIso().tee==="piq";
  document.getElementById("xPdf").addEventListener("click",()=>{const iso=curIso();if(!iso.segs.length){toast("Le plan est vide.");return;}offerFile(safeName(iso.name)+".pdf",isoPDF(iso));});
  document.getElementById("xSvg").addEventListener("click",()=>{const iso=curIso();if(!iso.segs.length){toast("Le plan est vide.");return;}offerFile(safeName(iso.name)+".svg",isoSVGFile(iso));});
  document.getElementById("xTxt").addEventListener("click",()=>{const txt=isoText(curIso());(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Liste copiée."),()=>{document.getElementById("xOut").innerHTML=`<textarea class="inp" style="height:200px;font-size:14px;padding:10px;margin-top:10px" readonly aria-label="Liste de coupe">${esc(txt)}</textarea>`;});});
  let delC=false;document.getElementById("isoDel").addEventListener("click",e=>{if(!delC){delC=true;e.target.textContent="Confirmer la suppression";return;}Store.delIso(ED.id);location.hash="iso";});
  window.addEventListener("resize",()=>{if(ED&&document.getElementById("isvg"))drawStage();});
  syncForm();
}
function delSeg(i){
  const iso=JSON.parse(JSON.stringify(curIso()));
  if(iso.segs.some((s,j)=>j!==i&&s.f===i+1)){toast(`D'autres tronçons partent de la fin de T${i+1} : supprime-les d'abord.`);ED.confirm=null;renderSel();return;}
  const from=iso.segs[i].f;iso.segs.splice(i,1);iso.segs.forEach(s=>{if(s.f>i+1)s.f-=1;});
  const ne={};Object.keys(iso.ends||{}).forEach(k=>{const n=+k;if(n===i+1)return;ne[n>i+1?n-1:n]=iso.ends[k];});iso.ends=ne;
  if(ED.start===i+1)ED.start=from;else if(ED.start>i+1)ED.start-=1;ED.start=Math.min(ED.start,iso.segs.length);
  ED.sel=null;ED.confirm=null;if(ED.editing!=null){ED.editing=null;syncForm();}
  isoChanged(iso);
}
function drawStage(){
  const st=document.getElementById("stage"),svg=document.getElementById("isvg");if(!st||!svg)return;
  const iso=curIso(),W=st.clientWidth||360,H=st.clientHeight||320,G=svgAdapter();
  const view=ED.view.mode==="iso"?ISOVIEW:{yaw:ED.view.yaw,pitch:ED.view.pitch};
  drawIso(G,iso,ED.A,{W,H,x0:0,y0:0,k:1,view,zoom:ED.view.zoom,pan:ED.view.pan,pad:40,sel:ED.sel,nums:iso.nums!==false,dims:iso.dims!==false,start:ED.start});
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.innerHTML=G.out();
  document.getElementById("isoEmpty").hidden=iso.segs.length>0;
}
function renderSel(){
  const box=document.getElementById("selBox"),iso=curIso(),i=ED.sel;
  if(i==null||!iso.segs[i]){box.innerHTML="";return;}
  const s=iso.segs[i],ps=ED.A.pieces.filter(p=>p.segs.includes(i)),acs=accList(s),A=ED.A;
  const endSel=(node,label)=>{const nd=A.nodes[node];if(!nd||nd.type!=="libre")return "";const en=(iso.ends||{})[node]||{t:"libre",L:0};
    return `<label class="fld"><span>${label}</span><select data-endt="${node}">${Object.keys(ENDN).map(k=>`<option value="${k}"${en.t===k?" selected":""}>${ENDN[k]}</option>`).join("")}</select></label><label class="fld"${en.t==="libre"?" hidden":""}><span>Longueur du raccord <em>mm</em></span><input data-endl="${node}" inputmode="decimal" value="${esc(en.L||0)}"></label>`;};
  const ends=endSel(i+1,`Bout de T${i+1}`)+(s.f===0?endSel(0,"Départ (point A)"):"");
  box.innerHTML=`<div class="card selbar"><b style="font-family:var(--display);font-size:22px">T${i+1} · ${esc(segName(s))} · ${fmt(s.L,0)} mm</b>
  <div class="lede">${ps.map(p=>`${p.rep} à couper : <b style="color:var(--ink)">${fmt(p.len,0)} mm</b>`).join(" · ")}</div>
  <div class="actions"><button class="btn small" data-a="edit">Modifier</button><button class="btn small" data-a="end">Partir de sa fin</button><button class="btn small" data-a="begin">Partir de son début</button><button class="btn small danger" data-a="del">${ED.confirm===i?"Confirmer":"Supprimer"}</button></div>
  <div class="sublbl">Accessoires sur T${i+1}</div>
  ${acs.length?`<dl class="rlist">${acs.map((x,k)=>`<div><dt>${esc(ACCN[x.t]||x.t)}<br><small>à ${fmt(x.pos,0)} mm du début${INLINE[x.t]!==undefined?` · long. ${fmt(x.L||0,0)} mm`:""}</small></dt><dd><button class="btn small" data-a="delacc" data-k="${k}">Retirer</button></dd></div>`).join("")}</dl>`:`<p class="lede" style="margin:0">Aucun accessoire sur ce tronçon.</p>`}
  <div class="fields" style="margin-top:10px"><label class="fld wide"><span>Accessoire à ajouter</span><select id="aT">${accOptions(false)}</select></label>
    <label class="fld"><span>Depuis le début <em>mm</em></span><input id="aP" inputmode="decimal" value="${Math.round(s.L/2)}"></label>
    <label class="fld" id="aLw"><span>Longueur <em>mm</em></span><input id="aL" inputmode="decimal" value="150"></label></div>
  <button class="btn" data-a="addacc" style="width:100%;margin-top:10px">Ajouter sur T${i+1}</button>
  ${ends?`<div class="sublbl">Extrémités</div><div class="fields">${ends}</div>`:""}</div>`;
  const aT=document.getElementById("aT"),upd=()=>{const il=INLINE[aT.value];document.getElementById("aLw").hidden=il===undefined;if(il!==undefined)document.getElementById("aL").value=il;};aT.addEventListener("change",upd);upd();
}
function isoRefresh(){
  const iso=curIso();if(!iso)return;ED.A=analyseIso(iso);const A=ED.A;
  if(ED.sel!=null&&!iso.segs[ED.sel])ED.sel=null;ED.start=Math.min(ED.start,iso.segs.length);
  document.getElementById("isoSub").textContent=`${iso.segs.length} tronçon${iso.segs.length>1?"s":""} · ${A.pieces.length} pièce${A.pieces.length>1?"s":""} · ${A.welds.length} soudure${A.welds.length>1?"s":""} · ${fmt(A.tot/1000,2)} m de tube`;
  document.getElementById("startPill").textContent=ED.start===0?"Départ : point A":`Départ : fin de T${ED.start}`;
  drawStage();renderSel();
  document.getElementById("isoOut").innerHTML=(A.warn.map(w=>`<div class="msg warn">${esc(w)}</div>`).join(""))+(iso.segs.length?`
  <div class="card"><h3>Liste de coupe</h3><div class="tscroll" style="margin-top:6px"><table class="t"><thead><tr><th>Rep.</th><th>Longueur</th><th>Tronçons</th><th>Bouts</th></tr></thead><tbody>${A.pieces.map(p=>`<tr><td><b>${p.rep}</b></td><td><b style="${p.len<0?"color:var(--bad)":""}">${fmt(p.len,0)}</b> <small style="color:var(--muted)">mm</small></td><td>${p.segs.map(i=>"T"+(i+1)).join("+")}</td><td style="color:var(--muted);font-size:14px">${esc(p.notes.join(" / "))}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="card"><h3>Nomenclature</h3><dl class="rlist" style="margin-top:4px">${A.bom.map(r=>`<div><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join("")}</dl></div>
  <ul class="notes"><li>Cotes d'axe en axe (entre les sommets). Longueurs de coupe : coudes, tés et écart de soudure (${fmt(iso.gap||0,1)} mm) déduits.</li>${iso.R>0?"":"<li>Coupes d'onglet : la longueur est prise sur l'axe ; côté extérieur, ajoute Ø/2 × tan(angle de coupe).</li>"}${iso.tee==="piq"?"<li>Piquage : le tube principal passe d'une pièce ; trace la gueule de loup avec l'outil « Gabarit de piquage ».</li>":""}</ul>`:"");
}

/* ---------- démarrage ---------- */
route();
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{const w=reg.installing;if(!w)return;w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)toast("Nouvelle version prête : ferme et rouvre l'appli.");});});
  }).catch(()=>{});
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
</script>
